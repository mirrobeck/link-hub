          },

            'card': '0 25px 60px -15px rgba(0, 0, 0, 0.45), 0 0 1px 1px rgba(255, 255, 255, 0.1)',

            'fade-in': 'fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',

            fadeIn: {
              '0%': { opacity: '0' },

            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(16px)' },

            },
            pulseSubtle: {
              '0%, 100%': { opacity: '1' },

    /**

      // Verified Badge

        verifiedEl.classList.add("hidden");

    /**
     * Native Web Share API or Clipboard Copy Handler
     */
    async function handleShareProfile() {
      const shareData = {
        title: `${CONFIG.profile.name} - Link Hub`,
        text: CONFIG.profile.bio,
        url: window.location.href,
      };

      if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
        try {
          await navigator.share(shareData);
        } catch (err) {
          if (err.name !== "AbortError") {
            copyToClipboard(window.location.href);
          }
        }
      } else {
        copyToClipboard(window.location.href);
      }
    }

    /**
     * Copy URL explicitly
     */
    function handleCopyCurrentUrl() {
      copyToClipboard(window.location.href);
    }

    /**
     * Utility: Copy text to clipboard and trigger sleek toast
     */
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast("Profile link copied to clipboard!");
        }).catch(() => {
          fallbackCopyText(text);
        });
      } else {
        fallbackCopyText(text);
      }
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand("copy");
        showToast("Profile link copied to clipboard!");
      } catch (err) {
        showToast("Unable to copy link automatically.");
      }
      document.body.removeChild(textArea);
    }

    /**
     * Toast alert helper
     */
    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById("toast");
      const messageEl = document.getElementById("toast-message");
      
      messageEl.textContent = message;
      toast.classList.remove("opacity-0", "translate-y-4", "pointer-events-none");
      toast.classList.add("opacity-100", "translate-y-0");

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "translate-y-4", "pointer-events-none");
      }, 2600);
    }

    // Run when DOM is ready
    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
