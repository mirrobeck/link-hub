  <style>
    body {
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);

      background-color: #093339;
      background-image: radial-gradient(at 50% 0%, #135058 0px, transparent 65%);
      background-attachment: fixed;
    }
    .emoji { font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif; font-style: normal; line-height: 1; }
    .icon { display: block; fill: currentColor; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .rise { animation: rise .5s cubic-bezier(.16,1,.3,1) both; }

    /* ---------- Language switcher (Bootstrap 5.3 dropdown markup, vanilla JS) ---------- */
    .lang-switcher { position: absolute; top: 10px; left: 12px; z-index: 40; }
    .lang-toggle {
      display: inline-flex; align-items: center;
      min-width: 44px; min-height: 44px;           /* 44×44 touch target */
      padding: 0; border: 0; background: none; cursor: pointer;
      color: #94a3b8;                               /* same slate as Share icon */
      -webkit-tap-highlight-color: transparent;
    }
    .lang-pill {
      display: inline-flex; align-items: center; gap: 4px;
      height: 32px; padding: 0 7px;
      border-radius: 999px; background: transparent;
      font-size: 13px; font-weight: 600; line-height: 1; letter-spacing: .02em; text-transform: uppercase;
      transition: background-color .15s ease, color .15s ease;
    }
    .lang-chevron { transition: transform .15s ease; }
    /* Very narrow phones (≤359px): tighten so the pill keeps clear of the avatar */
    @media (max-width: 359px) { .lang-pill { gap: 3px; padding: 0 5px; } }
    .lang-toggle[aria-expanded="true"] .lang-chevron { transform: rotate(180deg); }
    .lang-toggle[aria-expanded="true"] .lang-pill { background: #f1f5f9; color: #334155; }
    @media (hover: hover) { .lang-toggle:hover .lang-pill { background: #f1f5f9; color: #334155; } }
    .lang-toggle:active .lang-pill { background: #e2e8f0; color: #334155; }
    .lang-toggle:focus { outline: none; }
    .lang-toggle:focus-visible .lang-pill { outline: 2px solid #0d9488; outline-offset: 2px; color: #334155; }

    .lang-switcher .dropdown-menu {
      position: absolute; top: calc(100% - 4px); left: 0;
      min-width: 184px; margin: 0; padding: 8px; list-style: none;
      background: #fff; border-radius: 12px;
      box-shadow: 0 12px 32px -8px rgba(15, 23, 42, .25), 0 0 0 1px rgba(15, 23, 42, .06);
      opacity: 0; visibility: hidden;
      transform: translateY(-4px) scale(.97); transform-origin: top left;
      transition: opacity .15s ease, transform .15s ease, visibility 0s linear .15s;
    }
    .lang-switcher .dropdown-menu.show {
      opacity: 1; visibility: visible; transform: none;
      transition: opacity .15s ease, transform .15s ease, visibility 0s;
    }
    .lang-switcher .dropdown-item {
      display: flex; align-items: center; gap: 10px;
      width: 100%; min-height: 40px; padding: 0 10px;
      border: 0; border-radius: 8px; background: none; cursor: pointer;
      font-size: 14px; font-weight: 500; color: #1e293b; text-align: left;
    }
    .lang-switcher .dropdown-item:focus { outline: none; }
    .lang-switcher .dropdown-item:focus-visible { outline: 2px solid #0d9488; outline-offset: -2px; background: #f1f5f9; }
    @media (hover: hover) { .lang-switcher .dropdown-item:hover { background: #f1f5f9; } }
    .lang-switcher .dropdown-item.active { font-weight: 600; }
    .lang-switcher .dropdown-item .check { flex-shrink: 0; color: #0f766e; visibility: hidden; }
    .lang-switcher .dropdown-item.active .check { visibility: visible; }
    .lang-switcher .dropdown-item .code { margin-left: auto; font-size: 12px; font-weight: 600; color: #94a3b8; }

    @media (prefers-reduced-motion: reduce) { .rise { animation: none; } * { transition: none !important; } }
  </style>
</head>

<body class="font-sans antialiased text-slate-800 flex flex-col items-center px-6 pt-20 pb-10 sm:pt-24">

  <!-- Card -->
  <main class="rise relative w-full max-w-[400px] bg-white rounded-3xl shadow-2xl shadow-black/30 px-5 sm:px-7 pt-16 pb-6">

    <!-- Language switcher (top-left corner of card, mirrors Share) -->
    <div class="dropdown lang-switcher" id="lang-switcher">
      <button id="lang-toggle" type="button" class="dropdown-toggle lang-toggle"
        aria-haspopup="true" aria-expanded="false" aria-controls="lang-menu"
        data-i18n-attr="aria-label:lang.label+lang.current">
        <span class="lang-pill">
          <span data-icon="globe" data-size="14"></span>
          <span id="lang-code"></span>
          <span class="lang-chevron flex"><span data-icon="chevron" data-size="10"></span></span>
        </span>
      </button>
      <ul id="lang-menu" class="dropdown-menu" role="menu" aria-labelledby="lang-toggle"></ul>
    </div>

    <!-- Share (top-right corner of card) -->
    <button id="share-btn" type="button" data-i18n-attr="aria-label:share.label;title:share.label"
      class="absolute top-3 right-3 w-10 h-10 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 active:bg-slate-100 transition">
      <span data-icon="share" data-size="16"></span>
    </button>

    <!-- Avatar (overlaps the top edge) -->
    <div class="absolute -top-14 left-1/2 -translate-x-1/2">
      <img id="profile-avatar" alt="" width="112" height="112" data-i18n-attr="alt:alt.avatar"
        class="w-28 h-28 rounded-full object-cover bg-slate-200 ring-4 ring-white shadow-lg" />
    </div>

    <!-- Profile -->
    <header class="text-center">
      <h1 id="profile-name" data-i18n="profile.name" class="text-[22px] leading-7 font-bold text-slate-900 tracking-tight"></h1>
      <p id="profile-handle" class="mt-0.5 text-[13px] font-medium text-teal-700"></p>
      <p id="profile-bio" data-i18n="profile.bio" class="mt-3 text-[14px] leading-[1.6] text-slate-500"></p>
    </header>

    <!-- Primary CTA -->
    <a id="primary-cta"
      class="mt-5 flex items-center justify-center gap-2 w-full min-h-12 py-3 rounded-full bg-black text-white text-[15px] font-semibold hover:-translate-y-0.5 hover:shadow-lg hover:shadow-black/25 active:scale-[0.98] transition duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 focus-visible:ring-offset-2">
      <span class="emoji text-base" id="primary-cta-emoji" aria-hidden="true"></span>
      <span id="primary-cta-label"></span>
    </a>

    <!-- Socials -->
    <ul id="social-grid" class="mt-6 flex flex-wrap justify-center gap-y-4" data-i18n-attr="aria-label:aria.socials"></ul>

    <!-- Secondary links -->
    <nav id="secondary-links" class="mt-6 flex flex-col gap-3" data-i18n-attr="aria-label:aria.links"></nav>

    <!-- Footer -->
    <footer class="mt-6 text-center">
      <p id="footer-text" data-i18n="footer.copyright" class="text-xs text-slate-400"></p>
    </footer>
  </main>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 pointer-events-none bg-slate-900 text-white px-4 py-2.5 rounded-full shadow-2xl text-xs font-medium transition-all duration-300 z-50">

    ICONS.chevron = ["0 0 16 16", "M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708", "evenodd"];
    ICONS.check   = ["0 0 16 16", "M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0"];

    function icon(name, size = 20) {
      const def = ICONS[name];
      if (!def) return "";
      return `<svg class="icon" width="${size}" height="${size}" viewBox="${def[0]}" aria-hidden="true"><path fill-rule="${def[2] || 'nonzero'}" clip-rule="${def[2] || 'nonzero'}" d="${def[1]}"/></svg>`;
    }

    function hydrateIcons() {
      document.querySelectorAll("[data-icon]").forEach((el) => {
        el.outerHTML = icon(el.dataset.icon, Number(el.dataset.size) || 20);
      });
    }

    function setLink(a, url) {
      a.href = url;
      if (/^https?:\/\//i.test(url)) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      } else if (/^tel:/i.test(url)) {
        a.target = "_self";
        a.removeAttribute("rel");
        a.onclick = (e) => {
          // Direct navigation to telephone prompt
          window.location.href = url;
        };
      } else {
        a.target = "_self";
        a.removeAttribute("rel");
      }
    }

    function initialsAvatar(name) {
      const initials = name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
      return "data:image/svg+xml," + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#093339"/><text x="50" y="50" dy=".35em" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="36" fill="#fff">${initials}</text></svg>`
      );
    }


    /* ================================================================= */
    const I18N = window.I18N;
    const YEAR = new Date().getFullYear();
    let currentLang = window.__LANG || I18N.defaultLang;
    const t = (key, lang = currentLang) => I18N.t(key, lang, { year: YEAR });

    function render() {
      const { profile, primaryCta, socials, links } = CONFIG;

      // Profile
      const avatar = document.getElementById("profile-avatar");
      avatar.onerror = () => { avatar.onerror = null; avatar.src = initialsAvatar(t("profile.name", "en")); };
      avatar.src = profile.avatarUrl || initialsAvatar(t("profile.name", "en"));
      document.getElementById("profile-handle").textContent = profile.handle;

      // Primary CTA
      setLink(document.getElementById("primary-cta"), primaryCta.url);
      document.getElementById("primary-cta-emoji").textContent = primaryCta.emoji;
      document.getElementById("primary-cta-label").dataset.i18n = primaryCta.key;

      // Socials — 4 per row, remaining row centered
      const grid = document.getElementById("social-grid");
      grid.innerHTML = "";
      socials.forEach((s) => {
        const li = document.createElement("li");
        li.className = "w-1/4 flex justify-center";
        const a = document.createElement("a");
        setLink(a, s.url);
        a.className = "group flex flex-col items-center gap-1.5 focus:outline-none";
        a.innerHTML = `
          <span class="w-12 h-12 rounded-full bg-black text-white flex items-center justify-center group-hover:scale-105 group-hover:shadow-lg group-active:scale-95 group-focus-visible:ring-2 group-focus-visible:ring-teal-600 group-focus-visible:ring-offset-2 transition duration-200">
            ${icon(s.icon, 20)}
          </span>
          <span class="text-[11px] font-medium text-slate-500 text-center" data-i18n="${s.key}"></span>`;
        li.appendChild(a);
        grid.appendChild(li);
      });

      // Secondary links — emoji on the left, text left-aligned
      const list = document.getElementById("secondary-links");
      list.innerHTML = "";
      links.forEach((l) => {
        const a = document.createElement("a");
        setLink(a, l.url);
        a.className = "flex items-center gap-3.5 w-full min-h-[56px] px-4 py-3 rounded-2xl bg-white border border-slate-200 text-left hover:border-slate-400 hover:-translate-y-0.5 hover:shadow-md active:bg-slate-50 active:scale-[0.99] transition duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600";
        a.innerHTML = `
          <span class="emoji text-[22px] w-7 text-center shrink-0" aria-hidden="true">${l.emoji}</span>
          <span class="text-[15px] font-semibold text-slate-800" data-i18n="${l.key}"></span>`;
        list.appendChild(a);
      });

      // Language menu items (endonyms, no flags)
      const menu = document.getElementById("lang-menu");
      menu.innerHTML = I18N.supported.map((code) => `
        <li role="none">
          <button type="button" class="dropdown-item" role="menuitem" tabindex="-1" lang="${code}" data-lang="${code}">
            <span class="check flex"><span data-icon="check" data-size="16"></span></span>
            <span data-i18n="lang.${code}"></span>
            <span class="code">${code.toUpperCase()}</span>
          </button>
        </li>`).join("");

      hydrateIcons();
    }

    /* ---------- i18n: apply a language to the whole page ---------- */
    function setMeta(selector, value) {
      const el = document.querySelector(selector);
      if (el) el.setAttribute("content", value);
    }

    function applyLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;

      // Text content
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
      });

      // Attributes: "attr:key" pairs separated by ";" — "key+key2" joins with ". "
      document.querySelectorAll("[data-i18n-attr]").forEach((el) => {
        el.dataset.i18nAttr.split(";").forEach((pair) => {
          const [attr, keys] = pair.split(":").map((s) => s.trim());
          if (attr && keys) el.setAttribute(attr, keys.split("+").map((k) => t(k)).join(". "));
        });
      });

      // Document title + meta tags
      document.title = t("meta.title");
      setMeta('meta[name="description"]', t("profile.bio"));
      setMeta('meta[property="og:title"]', t("meta.title"));
      setMeta('meta[property="og:description"]', t("profile.bio"));
      setMeta('meta[property="og:locale"]', I18N.ogLocale[lang]);

      // Switcher state
      document.getElementById("lang-code").textContent = lang.toUpperCase();
      document.querySelectorAll("#lang-menu .dropdown-item").forEach((item) => {
        const active = item.dataset.lang === lang;
        item.classList.toggle("active", active);
        if (active) item.setAttribute("aria-current", "true");
        else item.removeAttribute("aria-current");
      });
    }

    function setLang(lang) {
      if (!I18N.supported.includes(lang)) return;
      applyLang(lang);
      try { localStorage.setItem(I18N.storageKey, lang); } catch (e) { /* storage blocked */ }
      try {
        const url = new URL(location.href);
        url.searchParams.set("lang", lang);
        history.replaceState(history.state, "", url);
      } catch (e) { /* file:// or sandboxed */ }
    }

    /* ---------- Language dropdown (Bootstrap 5.3 pattern, vanilla JS) ---------- */
    function initLangDropdown() {
      const root = document.getElementById("lang-switcher");
      const toggle = document.getElementById("lang-toggle");
      const menu = document.getElementById("lang-menu");
      const items = () => [...menu.querySelectorAll(".dropdown-item")];
      const isOpen = () => menu.classList.contains("show");

      function open(focus) {
        menu.classList.add("show");
        toggle.setAttribute("aria-expanded", "true");
        if (focus) {
          const list = items();
          const target = focus === "last" ? list[list.length - 1]
            : (list.find((i) => i.classList.contains("active")) || list[0]);
          target.focus();
        }
      }
      function close(returnFocus) {
        if (!isOpen()) return;
        menu.classList.remove("show");
        toggle.setAttribute("aria-expanded", "false");
        if (returnFocus) toggle.focus();
      }

      // Mouse/touch click, or Enter/Space (keyboard clicks have detail === 0)
      toggle.addEventListener("click", (e) => {
        if (isOpen()) close(false);
        else open(e.detail === 0 ? "active" : null);
      });

      toggle.addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") { e.preventDefault(); open("active"); }
        else if (e.key === "ArrowUp") { e.preventDefault(); open("last"); }
        else if (e.key === "Escape") { close(true); }
      });

      menu.addEventListener("keydown", (e) => {
        const list = items();
        const idx = list.indexOf(document.activeElement);
        switch (e.key) {
          case "ArrowDown": e.preventDefault(); list[(idx + 1) % list.length].focus(); break;
          case "ArrowUp":   e.preventDefault(); list[(idx - 1 + list.length) % list.length].focus(); break;
          case "Home":      e.preventDefault(); list[0].focus(); break;
          case "End":       e.preventDefault(); list[list.length - 1].focus(); break;
          case "Escape":    e.preventDefault(); close(true); break;
          case "Tab":       close(false); break;
        }
      });

      menu.addEventListener("click", (e) => {
        const item = e.target.closest(".dropdown-item");
        if (!item) return;
        setLang(item.dataset.lang);
        close(true);
      });

      // Click/tap outside closes the menu
      document.addEventListener("pointerdown", (e) => {
        if (isOpen() && !root.contains(e.target)) close(false);
      });
      // Focus leaving the switcher (e.g. Tab) closes it
      root.addEventListener("focusout", (e) => {
        if (isOpen() && !root.contains(e.relatedTarget)) close(false);
      });
    }

    /* ---------- Share / copy link ---------- */
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("opacity-0", "translate-y-4");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.classList.add("opacity-0", "translate-y-4"), 2400);
    }

    async function share() {
      const data = { title: t("meta.title"), text: t("share.text"), url: location.href };
      if (navigator.share) {
        try { await navigator.share(data); return; }
        catch (e) { if (e.name === "AbortError") return; }
      }
      try { await navigator.clipboard.writeText(location.href); showToast(t("share.copied")); }
      catch { showToast(location.href); }
    }

    document.getElementById("share-btn").addEventListener("click", share);
    render();
    applyLang(currentLang);
    initLangDropdown();
  </script>
