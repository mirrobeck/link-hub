<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mirazim Ruzimurodov</title>
  <meta name="description" content="Mirazim Ruzimurodov — Brand Designer, young entrepreneur, traveler, athlete." />
  <meta property="og:title" content="Mirazim Ruzimurodov" />
  <meta property="og:description" content="Man on the road. Brand Designer, entrepreneur, traveler, athlete." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#093339" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'] },
          boxShadow: {
            card: '0 25px 60px -15px rgba(0,0,0,0.45)',
            pill: '0 4px 14px 0 rgba(0,0,0,0.25)',
            'pill-hover': '0 10px 28px rgba(0,0,0,0.35)',
          },
        },
      },
    };
  </script>

  <style>
    body {
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-tap-highlight-color: transparent;
      background-color: #093339;
      background-image:
        radial-gradient(at 50% 10%, #14535e 0px, transparent 60%),
        radial-gradient(at 10% 90%, #0d3e46 0px, transparent 50%);
      background-attachment: fixed;
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .animate-slide-up { animation: slideUp .6s cubic-bezier(.16,1,.3,1) both; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-fill { fill: currentColor; stroke: none; }
  </style>
</head>

<body class="font-sans antialiased text-slate-800 flex flex-col items-center px-4 py-8 sm:py-14">

  <!-- Share button -->
  <div class="w-full max-w-[460px] flex justify-end mb-4 px-1">
    <button id="share-btn" type="button"
      class="flex items-center gap-1.5 bg-black/25 hover:bg-black/40 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 text-xs font-medium text-white/90 hover:text-white transition active:scale-95"
      aria-label="Share profile">
      <span data-icon="share" data-size="14"></span>
      <span>Share</span>
    </button>
  </div>

  <!-- Card -->
  <main class="w-full max-w-[460px] bg-white rounded-[28px] sm:rounded-[32px] shadow-card p-6 sm:p-8 animate-slide-up">

    <!-- Profile -->
    <header class="flex flex-col items-center text-center">
      <div class="relative mb-4">
        <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full p-1 bg-gradient-to-b from-slate-200 to-slate-300 shadow-md">
          <img id="profile-avatar" alt="" class="w-full h-full object-cover rounded-full bg-slate-100" />
        </div>
        <div id="verified-badge" class="absolute bottom-1 right-1 bg-blue-600 text-white p-1 rounded-full border-2 border-white flex">
          <span data-icon="check" data-size="12" data-stroke="3.5"></span>
        </div>
      </div>
      <h1 id="profile-name" class="text-2xl sm:text-[26px] font-bold text-slate-900 tracking-tight"></h1>
      <p id="profile-handle" class="text-xs font-semibold text-teal-800 tracking-wide mt-0.5 mb-3"></p>
      <p id="profile-bio" class="text-sm text-slate-600 leading-relaxed max-w-[370px]"></p>
    </header>

    <!-- Primary CTA -->
    <section class="mt-6 sm:mt-7" aria-label="Featured link">
      <a id="primary-cta"
        class="group flex items-center justify-between w-full bg-[#111827] hover:bg-black text-white pl-2.5 pr-3 py-2.5 rounded-full shadow-pill hover:shadow-pill-hover hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#093339] focus-visible:ring-offset-2">
        <span class="w-10 h-10 rounded-full bg-white/15 flex items-center justify-center text-amber-300 shrink-0">
          <span data-icon="zap" data-size="18" data-fill="1"></span>
        </span>
        <span id="primary-cta-label" class="flex-1 text-center font-bold text-[15px] tracking-tight"></span>
        <span class="w-8 h-8 rounded-full bg-white/10 group-hover:bg-white/20 flex items-center justify-center shrink-0 transition">
          <span data-icon="arrowUpRight" data-size="16"></span>
        </span>
      </a>
    </section>

    <!-- Socials -->
    <section class="mt-7" aria-label="Socials and contacts">
      <ul id="social-grid" class="flex flex-wrap justify-center gap-y-5"></ul>
    </section>

    <!-- Secondary links -->
    <section class="mt-7 pt-7 border-t border-slate-100" aria-label="Links">
      <div id="secondary-links" class="flex flex-col gap-3"></div>
    </section>

    <!-- Footer -->
    <footer class="mt-8 pt-5 border-t border-slate-100 text-center">
      <p id="footer-text" class="text-xs font-medium text-slate-400"></p>
    </footer>
  </main>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 pointer-events-none bg-slate-900/95 text-white px-4 py-2.5 rounded-full shadow-2xl text-xs font-medium transition-all duration-300 z-50">
    Link copied to clipboard!
  </div>

  <script>
    /* =================================================================
     * ✏️  EDIT EVERYTHING HERE
     * Replace every "#" with your real link.
     * ================================================================= */
    const CONFIG = {
      profile: {
        name: "Mirazim Ruzimurodov",
        handle: "@itsmirazim",
        verified: true,
        bio: "Man on the road. Brand Designer('21), Webster University‘27 (Int'l Relations/Econ), young entrepreneur, traveler, athlete. Speaks 5+ languages, badly. More👇🏻",
        // Put your photo in this folder named "avatar.jpg" (or paste an image URL).
        // If the photo is missing, your initials are shown instead.
        avatarUrl: "avatar.jpg",
      },

      primaryCta: {
        label: "Telegram Blog",
        url: "#", // e.g. https://t.me/yourchannel
      },

      // icon: behance | instagram | telegram | linkedin | x | phone | email
      socials: [
        { label: "Behance",   icon: "behance",   url: "#" }, // https://behance.net/username
        { label: "Instagram", icon: "instagram", url: "#" }, // https://instagram.com/username
        { label: "Telegram",  icon: "telegram",  url: "#" }, // https://t.me/username
        { label: "LinkedIn",  icon: "linkedin",  url: "#" }, // https://linkedin.com/in/username
        { label: "X",         icon: "x",         url: "#" }, // https://x.com/username
        { label: "Phone",     icon: "phone",     url: "#" }, // tel:+998901234567
        { label: "Email",     icon: "email",     url: "#" }, // mailto:you@example.com
      ],

      links: [
        { label: "Create your own brand",          url: "#" },
        { label: "Apply for Work and Travel",      url: "#" },
        { label: "Apply for your Green Card 2027", url: "#" },
      ],

      footer: `© ${new Date().getFullYear()} Mirazim Ruzimurodov`,
    };

    /* =================================================================
     * Built-in SVG icons (no external icon library = nothing can break)
     * ================================================================= */
    const ICONS = {
      instagram: '<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/>',
      linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
      x: { fill: true, path: '<path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>' },
      telegram: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
      phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
      email: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
      share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/>',
      check: '<path d="M20 6 9 17l-5-5"/>',
      zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
      arrowUpRight: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
    };

    function svg(name, { size = 20, stroke = 2, fill = false } = {}) {
      if (name === "behance") {
        return `<span style="font-size:${size * 0.85}px" class="font-extrabold leading-none tracking-tight">Bē</span>`;
      }
      const def = ICONS[name];
      if (!def) return "";
      const isFill = fill || (typeof def === "object" && def.fill);
      const body = typeof def === "object" ? def.path : def;
      return `<svg class="icon ${isFill ? "icon-fill" : ""}" style="width:${size}px;height:${size}px;stroke-width:${stroke}" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`;
    }

    // Replace static <span data-icon="..."> placeholders
    function hydrateIcons(root = document) {
      root.querySelectorAll("[data-icon]").forEach((el) => {
        el.outerHTML = svg(el.dataset.icon, {
          size: Number(el.dataset.size) || 20,
          stroke: Number(el.dataset.stroke) || 2,
          fill: el.dataset.fill === "1",
        });
      });
    }

    function applyLinkTarget(a, url) {
      a.href = url;
      if (/^https?:\/\//i.test(url)) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
    }

    function initialsAvatar(name) {
      const initials = name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
      return "data:image/svg+xml," + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#093339"/><text x="50" y="50" dy=".35em" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="36" fill="#ffffff">${initials}</text></svg>`
      );
    }

    /* ================================================================= */
    function render() {
      const { profile, primaryCta, socials, links, footer } = CONFIG;

      // Profile
      const avatar = document.getElementById("profile-avatar");
      avatar.alt = profile.name;
      avatar.onerror = () => { avatar.onerror = null; avatar.src = initialsAvatar(profile.name); };
      avatar.src = profile.avatarUrl || initialsAvatar(profile.name);
      document.getElementById("verified-badge").classList.toggle("hidden", !profile.verified);
      document.getElementById("profile-name").textContent = profile.name;
      document.getElementById("profile-handle").textContent = profile.handle;
      document.getElementById("profile-bio").textContent = profile.bio;

      // Primary CTA
      const cta = document.getElementById("primary-cta");
      applyLinkTarget(cta, primaryCta.url);
      document.getElementById("primary-cta-label").textContent = primaryCta.label;

      // Socials (4 per row on top, rest centered below)
      const grid = document.getElementById("social-grid");
      grid.innerHTML = "";
      socials.forEach((s) => {
        const li = document.createElement("li");
        li.className = "w-1/4 flex justify-center";
        const a = document.createElement("a");
        applyLinkTarget(a, s.url);
        a.setAttribute("aria-label", s.label);
        a.className = "group flex flex-col items-center gap-1.5 focus:outline-none";
        a.innerHTML = `
          <span class="w-[52px] h-[52px] sm:w-14 sm:h-14 rounded-full bg-[#111827] text-white flex items-center justify-center shadow-md group-hover:bg-black group-hover:scale-110 group-hover:shadow-lg group-active:scale-95 group-focus-visible:ring-2 group-focus-visible:ring-[#093339] group-focus-visible:ring-offset-2 transition-all duration-200">
            ${svg(s.icon)}
          </span>
          <span class="text-xs font-medium text-slate-500 group-hover:text-slate-900 transition-colors">${s.label}</span>`;
        li.appendChild(a);
        grid.appendChild(li);
      });

      // Secondary links (text only)
      const list = document.getElementById("secondary-links");
      list.innerHTML = "";
      links.forEach((l) => {
        const a = document.createElement("a");
        applyLinkTarget(a, l.url);
        a.className = "block w-full text-center px-5 py-4 rounded-2xl bg-white border border-slate-200 text-[15px] font-semibold text-slate-800 hover:border-slate-400 hover:bg-slate-50 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0 transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#093339]";
        a.textContent = l.label;
        list.appendChild(a);
      });

      document.getElementById("footer-text").textContent = footer;
      hydrateIcons();
    }

    /* Share / copy */
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("opacity-0", "translate-y-4");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => t.classList.add("opacity-0", "translate-y-4"), 2400);
    }

    async function share() {
      const data = { title: CONFIG.profile.name, url: location.href };
      if (navigator.share) {
        try { await navigator.share(data); return; } catch (e) { if (e.name === "AbortError") return; }
      }
      try {
        await navigator.clipboard.writeText(location.href);
        showToast("Link copied to clipboard!");
      } catch {
        showToast(location.href);
      }
    }

    document.getElementById("share-btn").addEventListener("click", share);
    render();
  </script>
</body>
</html>
