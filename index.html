<html lang="en">

  <meta property="og:description" content="Man on the road. Brand Designer, entrepreneur, traveler, athlete." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Plus Jakarta Sans for text + Noto Color Emoji so flags (🇺🇸) render on Windows too -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      // Hover styles apply only on devices with a real mouse,
      // so buttons never look "stuck/pressed" after a tap on phones.
      future: { hoverOnlyWhenSupported: true },
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'] },
        },
      },
    };
  </script>

  <style>
    body {
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-tap-highlight-color: transparent;
      background-color: #093339;
      background-image: radial-gradient(at 50% 0%, #135058 0px, transparent 65%);
      background-attachment: fixed;
    }
    .emoji { font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif; font-style: normal; line-height: 1; }
    .icon { display: block; fill: currentColor; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .rise { animation: rise .5s cubic-bezier(.16,1,.3,1) both; }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; } * { transition: none !important; } }
  </style>
</head>

<body class="font-sans antialiased text-slate-800 flex flex-col items-center px-6 pt-20 pb-10 sm:pt-24">

  <!-- Card -->
  <main class="rise relative w-full max-w-[400px] bg-white rounded-3xl shadow-2xl shadow-black/30 px-5 sm:px-7 pt-16 pb-6">

    <!-- Share (top-right corner of card) -->
    <button id="share-btn" type="button" aria-label="Share this page"
      class="absolute top-3 right-3 w-10 h-10 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 hover:bg-slate-100 active:bg-slate-100 transition">
      <span data-icon="share" data-size="16"></span>
    </button>

    <!-- Avatar (overlaps the top edge) -->
    <div class="absolute -top-14 left-1/2 -translate-x-1/2">
      <img id="profile-avatar" alt="" width="112" height="112"
        class="w-28 h-28 rounded-full object-cover bg-slate-200 ring-4 ring-white shadow-lg" />
    </div>

    <!-- Profile -->
    <header class="text-center">
      <h1 id="profile-name" class="text-[22px] leading-7 font-bold text-slate-900 tracking-tight"></h1>
      <p id="profile-handle" class="mt-0.5 text-[13px] font-medium text-teal-700"></p>
      <p id="profile-bio" class="mt-3 text-[14px] leading-[1.6] text-slate-500"></p>
    </header>

    <!-- Primary CTA -->
    <a id="primary-cta"
      class="mt-5 flex items-center justify-center gap-2 w-full h-12 rounded-full bg-black text-white text-[15px] font-semibold hover:-translate-y-0.5 hover:shadow-lg hover:shadow-black/25 active:scale-[0.98] transition duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600 focus-visible:ring-offset-2">
      <span class="emoji text-base" id="primary-cta-emoji" aria-hidden="true"></span>
      <span id="primary-cta-label"></span>
    </a>

    <!-- Socials -->
    <ul id="social-grid" class="mt-6 flex flex-wrap justify-center gap-y-4" aria-label="Social profiles and contacts"></ul>

    <!-- Secondary links -->
    <nav id="secondary-links" class="mt-6 flex flex-col gap-3" aria-label="Applications"></nav>

    <!-- Footer -->
    <footer class="mt-6 text-center">
      <p id="footer-text" class="text-xs text-slate-400"></p>
    </footer>
  </main>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-4 opacity-0 pointer-events-none bg-slate-900 text-white px-4 py-2.5 rounded-full shadow-2xl text-xs font-medium transition-all duration-300 z-50">

      facebook:  ["0 0 512 512", "M512 256C512 114.6 397.4 0 256 0S0 114.6 0 256C0 376 82.7 476.8 194.2 504.5l0-170.3-52.8 0 0-78.2 52.8 0 0-33.7c0-87.1 39.4-127.5 125-127.5 16.2 0 44.2 3.2 55.7 6.4l0 70.8c-6-.6-16.5-1-29.6-1-42 0-58.2 15.9-58.2 57.2l0 27.8 83.6 0-14.4 78.2-69.3 0 0 175.9C413.8 494.8 512 386.9 512 256z"],

    function icon(name, size = 20) {
      const def = ICONS[name];
      if (!def) return "";
      return `<svg class="icon" width="${size}" height="${size}" viewBox="${def[0]}" aria-hidden="true"><path d="${def[1]}"/></svg>`;
    }

    function hydrateIcons() {
      document.querySelectorAll("[data-icon]").forEach((el) => {
        el.outerHTML = icon(el.dataset.icon, Number(el.dataset.size) || 20);
      });
    }

    function setLink(a, url) {
      a.href = url;
      if (/^https?:\/\//i.test(url)) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
    }

    function initialsAvatar(name) {
      const initials = name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
      return "data:image/svg+xml," + encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#093339"/><text x="50" y="50" dy=".35em" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="36" fill="#fff">${initials}</text></svg>`
      );
    }

    /* ================================================================= */
    function render() {
      const { profile, primaryCta, socials, links, footer } = CONFIG;

      // Profile
      const avatar = document.getElementById("profile-avatar");
      avatar.alt = profile.name;
      avatar.onerror = () => { avatar.onerror = null; avatar.src = initialsAvatar(profile.name); };
      avatar.src = profile.avatarUrl || initialsAvatar(profile.name);
      document.getElementById("profile-name").textContent = profile.name;
      document.getElementById("profile-handle").textContent = profile.handle;
      document.getElementById("profile-bio").textContent = profile.bio;

      // Primary CTA
      setLink(document.getElementById("primary-cta"), primaryCta.url);
      document.getElementById("primary-cta-emoji").textContent = primaryCta.emoji;
      document.getElementById("primary-cta-label").textContent = primaryCta.label;

      // Socials — 4 per row, remaining row centered
      const grid = document.getElementById("social-grid");
      grid.innerHTML = "";
      socials.forEach((s) => {
        const li = document.createElement("li");
        li.className = "w-1/4 flex justify-center";
        const a = document.createElement("a");
        setLink(a, s.url);
        a.setAttribute("aria-label", s.label);
        a.className = "group flex flex-col items-center gap-1.5 focus:outline-none";
        a.innerHTML = `
          <span class="w-12 h-12 rounded-full bg-black text-white flex items-center justify-center group-hover:scale-105 group-hover:shadow-lg group-active:scale-95 group-focus-visible:ring-2 group-focus-visible:ring-teal-600 group-focus-visible:ring-offset-2 transition duration-200">
            ${icon(s.icon, 20)}
          </span>
          <span class="text-[11px] font-medium text-slate-500">${s.label}</span>`;
        li.appendChild(a);
        grid.appendChild(li);
      });

      // Secondary links — emoji on the left, text left-aligned
      const list = document.getElementById("secondary-links");
      list.innerHTML = "";
      links.forEach((l) => {
        const a = document.createElement("a");
        setLink(a, l.url);
        a.className = "flex items-center gap-3.5 w-full min-h-[56px] px-4 py-3 rounded-2xl bg-white border border-slate-200 text-left hover:border-slate-400 hover:-translate-y-0.5 hover:shadow-md active:bg-slate-50 active:scale-[0.99] transition duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-600";
        a.innerHTML = `
          <span class="emoji text-[22px] w-7 text-center shrink-0" aria-hidden="true">${l.emoji}</span>
          <span class="text-[15px] font-semibold text-slate-800">${l.label}</span>`;
        list.appendChild(a);
      });

      document.getElementById("footer-text").textContent = footer;
      hydrateIcons();
    }

    /* Share / copy link */
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("opacity-0", "translate-y-4");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => t.classList.add("opacity-0", "translate-y-4"), 2400);
    }

    async function share() {
      if (navigator.share) {
        try { await navigator.share({ title: CONFIG.profile.name, url: location.href }); return; }
        catch (e) { if (e.name === "AbortError") return; }
      }
      try { await navigator.clipboard.writeText(location.href); showToast("Link copied!"); }
      catch { showToast(location.href); }
    }

    document.getElementById("share-btn").addEventListener("click", share);
    render();
  </script>
</body>
</html>
